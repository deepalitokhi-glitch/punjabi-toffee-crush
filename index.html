<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Punjabi Toffee Crush - Fixed</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1905215538239803" crossorigin="anonymous"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8f5e9;font-family:Arial;display:flex;justify-content:center;min-height:100vh}
.main{width:100%;max-width:400px;padding:10px;padding-bottom:80px}
.top{background:#fff;border-radius:16px;padding:12px;text-align:center;border:3px solid #ff9800}
.card{background:#fff;border-radius:14px;padding:12px;margin-top:10px;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.lvl{border:2px solid #ffb300;border-radius:10px;padding:12px;display:flex;justify-content:space-between;align-items:center;margin:8px 0;background:#fffde7}
.lvl.locked{opacity:0.5;pointer-events:none;background:#eee}
.lvl.locked b{color:#999}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
.cell{aspect-ratio:1;background:#fff8e1;border:2px solid #ffb300;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer}
.cell.done{background:#a5d6a7;pointer-events:none}
#fall{height:420px;background:linear-gradient(#b3e5fc,#4fc3f7);border-radius:14px;position:relative;overflow:hidden;display:none;border:3px solid #0288d1;margin-top:10px}
.bub{position:absolute;background:#ffeb3b;padding:12px 18px;border-radius:22px;border:3px solid #d32f2f;font-weight:bold;font-size:18px;color:#000;box-shadow:0 4px 8px rgba(0,0,0,.3);cursor:pointer}
.speaker{display:none;background:#ffecb3;border:3px solid #ff9800;border-radius:14px;padding:12px;text-align:center;margin:10px 0}
.btn{width:100%;padding:12px;border:none;border-radius:22px;background:#4caf50;color:#fff;font-weight:bold;font-size:15px;margin-top:10px}
.bar{height:6px;background:#4caf50;border-radius:3px;transition:width 1s}
.ad{border:2px dashed orange;min-height:40px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;margin:8px 0;font-size:10px}
.foot{position:fixed;bottom:0;left:0;right:0;background:#fff;height:55px;display:flex;align-items:center;justify-content:center;border-top:3px solid #4caf50}
</style>
</head>
<body>
<div class="main">
<div class="top"><h1>🌾 ਪੰਜਾਬੀ ਟਾਫੀ ਕ੍ਰਸ਼</h1><p style="margin:0;font-size:12px">Pehli wali acchi game wapas!</p></div>
<div class="ad"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1905215538239803" data-ad-slot="1111111111" data-ad-format="auto"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script></div>

<div class="card" id="menu"></div>

<div class="card" id="game" style="display:none">
<div style="display:flex;justify-content:space-between"><button onclick="showMenu()" style="border:none;background:#eee;padding:6px 12px;border-radius:10px">⬅️ Back</button><b id="ln"></b><span>⭐<span id="sc">0</span> ⏰<span id="tm">0</span></span></div>
<div class="bar" id="bar" style="width:100%"></div>
<div class="speaker" id="spBox">🔊 <span id="sayEng" style="font-size:22px;color:#c62828">KAR</span> <small>(<span id="sayPbi">ਕਰ</span>)</small> <button onclick="speakAgain()" style="border:none;background:#ff9800;color:#fff;border-radius:10px;padding:5px 12px;margin-left:8px">🔊 Suno</button></div>
<p id="hi" style="text-align:center;font-size:12px;color:#2e7d32;background:#e8f5e9;padding:6px;border-radius:8px;margin:8px 0"></p>
<div class="grid" id="g"></div>
<div id="fall"></div>
<div id="win" style="display:none;text-align:center;background:#e8f5e9;padding:10px;border-radius:12px;border:2px solid #4caf50;margin-top:8px"><h3>🎉 ਸ਼ਾਬਾਸ਼!</h3><button class="btn" onclick="nextL()">Next Level ➡️</button></div>
<div id="lose" style="display:none;text-align:center;background:#ffebee;padding:10px;border-radius:12px;border:2px solid #f44336;margin-top:8px"><h3>⏰ Time Khatam!</h3><p>Score: <span id="fsc">0</span></p><button class="btn" style="background:#f44336" onclick="retry()">Retry 🔄</button></div>
</div>
</div>
<div class="foot"><ins class="adsbygoogle" style="display:inline-block;width:320px;height:50px" data-ad-client="ca-pub-1905215538239803" data-ad-slot="3333333333"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script></div>

<script>
let cur=0,sc=0,tl=0,t1,t2,t3,ac,currentEng="";
let unlocked=parseInt(localStorage.getItem('ptc_unlocked')||'1');
let punjabiMap={"KAR":"ਕਰ","MAR":"ਮਰ","GHAR":"ਘਰ","PAANI":"ਪਾਣੀ","UDA":"ਉਡਾ","AIDA":"ਐਦਾ","KELA":"ਕੇਲਾ","ANGOOR":"ਅੰਗੂਰ","MITTI":"ਮਿੱਟੀ","KHET":"ਖੇਤ","SEB":"ਸੇਬ","AAM":"ਅੰਬ"};
let punjabiVoice=null;
function loadVoices(){let vs=speechSynthesis.getVoices();punjabiVoice=vs.find(v=>v.lang.toLowerCase().includes('pa'))||vs.find(v=>v.lang.includes('hi-IN'))||vs[0];}
speechSynthesis.onvoiceschanged=loadVoices;loadVoices();
function beep(f=700){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();let o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=0.15;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+0.1);}catch(e){}}
function speak(eng){currentEng=eng;let pbi=punjabiMap[eng]||eng;document.getElementById('sayEng').innerText=eng;document.getElementById('sayPbi').innerText=pbi;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(pbi);if(punjabiVoice)u.voice=punjabiVoice;u.lang=punjabiVoice?punjabiVoice.lang:'pa-IN';u.rate=0.8;u.pitch=1;speechSynthesis.speak(u);}catch(e){}}
function speakAgain(){if(currentEng)speak(currentEng);}
function renderMenu(){
 let html='';
 let levels=[
  {n:"L1 Cookie",d:"12 toffee - 60s - No sound",icon:"🍪"},
  {n:"L2 UDA AIDA",d:"Speaker bolega - 30s",icon:"✈️"},
  {n:"L3 Cookie Alag",d:"15 toffee - 50s - No sound",icon:"🍩"},
  {n:"L4 KAR MAR GHAR PAANI",d:"Speaker bolega - 30s",icon:"🏠"},
  {n:"L5 Hard Cookie",d:"18 toffee - 40s - No sound",icon:"⭐"},
  {n:"L6 KELA ANGOOR",d:"Speaker bolega - 30s",icon:"🍌"}
 ];
 levels.forEach((l,i)=>{
  let lock=i+1>unlocked;
  html+=`<div class="lvl ${lock?'locked':''}" onclick="start(${i})"><span><b>${l.icon} ${l.n}</b><br><small>${l.d} ${lock?'🔒 Locked':''}</small></span><b>${lock?'🔒':'PLAY'}</b></div>`;
 });
 html+=`<p style="text-align:center;font-size:10px"><a href="privacy.html">Privacy</a> | <a href="about.html">About</a> | <a href="contact.html">Contact</a></p>`;
 document.getElementById('menu').innerHTML=html;
}
renderMenu();
function showMenu(){clearInterval(t1);clearInterval(t2);clearInterval(t3);speechSynthesis.cancel();document.getElementById('game').style.display='none';document.getElementById('menu').style.display='block';renderMenu();}
function start(n){
 if(n+1>unlocked){alert('Pehle pichla level complete karo!');return;}
 cur=n;sc=0;clearInterval(t1);clearInterval(t2);clearInterval(t3);speechSynthesis.cancel();
 document.getElementById('sc').innerText=0;document.getElementById('menu').style.display='none';document.getElementById('game').style.display='block';
 document.getElementById('win').style.display='none';document.getElementById('lose').style.display='none';
 document.getElementById('g').innerHTML='';document.getElementById('g').style.display='none';document.getElementById('fall').innerHTML='';document.getElementById('fall').style.display='none';
 document.getElementById('bar').style.width='100%';document.getElementById('bar').style.background='#4caf50';document.getElementById('spBox').style.display='none';
 let cfg=[
  {name:"L1 Cookie",need:12,time:60,type:"grid",emoji:['🍪','🍭','🧁']},
  {name:"L2 UDA AIDA",need:8,time:30,type:"speak",words:["UDA","AIDA"],other:["MITTI","KHET","GHAR","PAANI"]},
  {name:"L3 Cookie Alag",need:15,time:50,type:"grid",emoji:['🍩','🍫','🧁','🍪']},
  {name:"L4 KAR MAR GHAR PAANI",need:10,time:30,type:"speak",words:["KAR","MAR","GHAR","PAANI"],other:["UDA","AIDA","MITTI","KELA"]},
  {name:"L5 Hard Cookie",need:18,time:40,type:"grid",emoji:['⭐','🍪','🍩','🍭']},
  {name:"L6 KELA ANGOOR",need:8,time:30,type:"speak",words:["KELA","ANGOOR"],other:["SEB","AAM","UDA","KAR"]}
 ][n];
 document.getElementById('ln').innerText=cfg[n].name;
 tl=cfg[n].time;document.getElementById('tm').innerText=tl;
 document.getElementById('hi').innerText=cfg[n].type=="grid"?"Tap karo 🍬 banao - No sound - "+cfg[n].need:"Likha "+cfg[n].words[0]+" - Bolega "+punjabiMap[cfg[n].words[0]]+" - Sahi pe click karo!";
 t3=setInterval(()=>{tl--;document.getElementById('tm').innerText=tl;document.getElementById('bar').style.width=(tl/cfg[n].time*100)+'%';if(tl<=10)document.getElementById('bar').style.background='#f44336';if(tl<=0){clearInterval(t1);clearInterval(t2);clearInterval(t3);document.getElementById('fsc').innerText=sc;document.getElementById('lose').style.display='block';}},1000);
 if(cfg[n].type=="grid") gridGame(cfg[n]); else speakGame(cfg[n]);
}
function gridGame(c){
 document.getElementById('g').style.display='grid';document.getElementById('fall').style.display='none';document.getElementById('spBox').style.display='none';
 let g=document.getElementById('g');
 for(let i=0;i<36;i++){let d=document.createElement('div');d.className='cell';d.innerText=c.emoji[Math.floor(Math.random()*c.emoji.length)];d.onclick=()=>{if(d.classList.contains('done'))return;beep(600);d.innerText='🍬';d.classList.add('done');sc++;document.getElementById('sc').innerText=sc;if(sc>=c.need){clearInterval(t3);winLevel();}};g.appendChild(d);}
}
function speakGame(c){
 document.getElementById('g').style.display='none';document.getElementById('spBox').style.display='block';let b=document.getElementById('fall');b.style.display='block';b.innerHTML='';
 let target=c.words[Math.floor(Math.random()*c.words.length)];speak(target);
 t1=setInterval(()=>{
  let x=document.createElement('div');x.className='bub';
  let isT=Math.random()<0.6;let word=isT?target:(Math.random()<0.5?c.words[Math.floor(Math.random()*c.words.length)]:c.other[Math.floor(Math.random()*c.other.length)]);
  x.innerText=word;x.style.left=Math.floor(Math.random()*220)+'px';x.style.top='0px';
  x.onclick=()=>{
   if(x.innerText===target){beep(900);sc++;document.getElementById('sc').innerText=sc;x.remove();if(sc>=c.need){winLevel();}else{target=c.words[Math.floor(Math.random()*c.words.length)];speak(target);}}
   else{beep(150);x.style.background='#ffcdd2';setTimeout(()=>x.remove(),300);}
  };
  b.appendChild(x);
 },650);
 t2=setInterval(()=>{b.querySelectorAll('.bub').forEach(e=>{let t=parseInt(e.style.top)||0;e.style.top=(t+3)+'px';if(t>400)e.remove();});},25);
}
function winLevel(){
 clearInterval(t1);clearInterval(t2);clearInterval(t3);
 if(cur+1>=unlocked){unlocked=cur+2;localStorage.setItem('ptc_unlocked',unlocked);}
 document.getElementById('win').style.display='block';
}
function nextL(){if(cur<5)start(cur+1);else{showMenu();alert('6 Levels Done!');}}
function retry(){start(cur);}
</script>
</body>
</html>
