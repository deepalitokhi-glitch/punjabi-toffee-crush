<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Punjabi Games - Toffee Crush</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{min-height:100vh;background:linear-gradient(to bottom,#a8e6cf,#dcedc8);display:flex;justify-content:center;align-items:center;padding:15px}
.card{background:white;border-radius:25px;padding:20px;width:100%;max-width:380px;box-shadow:0 10px 30px rgba(0,0,0,0.2);text-align:center}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px 0}
.lvl{background:#fff8e1;border:2px solid #ffcc02;border-radius:15px;padding:15px;cursor:pointer}
.lvl.active{border-color:#ff4081;background:#fff0f0}
.lvl span{font-size:40px;display:block}
.btn{width:100%;background:#ff4081;color:white;border:none;padding:14px;border-radius:50px;font-size:18px;font-weight:bold;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;background:#fff3e0;padding:8px;border-radius:15px;margin:10px 0}
.cell{aspect-ratio:1;background:white;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;border:2px solid #ffe0b2}
.cell.selected{border-color:#ff4081;transform:scale(1.1);background:#ffe4ec}
.adBox{background:#e3f2fd;border:2px dashed #2196f3;border-radius:12px;padding:12px;margin:12px 0;font-size:13px;color:#1565c0}
</style>
</head>
<body>
<div class="card" id="menuScreen">
  <h1>🌾 Punjabi Games</h1>
  <p>Menu + Sound + Ad Ready</p>
  <div class="levels">
    <div class="lvl active" onclick="selectLevel(1)"><span>🍪</span><b>Level 1</b><br><small>Toffee Crush</small></div>
    <div class="lvl" onclick="selectLevel(2)"><span>🪁</span><b>Level 2</b></div>
  </div>
  <button class="btn" onclick="playNow()">▶️ Play Now</button>
  <p style="font-size:11px;color:#888;margin-top:8px">1 Ad on Level Complete - Earning ₹ + $</p>
</div>

<div class="card" id="gameScreen" style="display:none">
  <div style="display:flex;justify-content:space-between"><button onclick="goMenu()">⬅️ Menu</button><b>Score: <span id="score">0</span></b><span>🎯 100</span></div>
  <div class="grid" id="grid"></div>
  <div class="adBox" id="gameAd" style="display:none">🎉 Level Complete! Ad Area - Earning 💰</div>
  <button onclick="newGame()">🔄 New Game</button>
</div>

<script>
let score=0,selectedCell=null,board=[];const toffees=['🍬','🍭','🍫','🍪','🧁','🍩'];
function selectLevel(n){if(n==2){alert('Level 2 Jaldi Ayega! Level 1 khelo');return}}
function playNow(){document.getElementById('menuScreen').style.display='none';document.getElementById('gameScreen').style.display='block';newGame()}
function goMenu(){document.getElementById('gameScreen').style.display='none';document.getElementById('menuScreen').style.display='block'}
function newGame(){score=0;document.getElementById('score').innerText=score;board=[];const grid=document.getElementById('grid');grid.innerHTML='';for(let i=0;i<36;i++){let t=toffees[Math.floor(Math.random()*toffees.length)];board.push(t);let div=document.createElement('div');div.className='cell';div.innerText=t;div.onclick=()=>clickCell(i);grid.appendChild(div)}}
function clickCell(i){const cells=document.querySelectorAll('.cell');if(selectedCell===null){selectedCell=i;cells[i].classList.add('selected')}else{if(Math.abs(selectedCell-i)==1||Math.abs(selectedCell-i)==6){let temp=board[selectedCell];board[selectedCell]=board[i];board[i]=temp;cells[selectedCell].innerText=board[selectedCell];cells[i].innerText=board[i];score+=10;document.getElementById('score').innerText=score;if(score>=100){document.getElementById('gameAd').style.display='block';setTimeout(()=>{alert('Level Complete! Earning Box dikha?');document.getElementById('gameAd').style.display='none';goMenu()},4000)}}cells[selectedCell].classList.remove('selected');selectedCell=null}}
</script>
</body>
</html>
