<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Punjabi Toffee Crush</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1905215538239803" crossorigin="anonymous"></script>
<style>
body{margin:0;background:#dcedc8;font-family:Arial;display:flex;justify-content:center}
.main{width:400px;max-width:100%;padding:10px;padding-bottom:70px}
.top{background:#fff;border-radius:12px;padding:10px;text-align:center;border:3px solid orange}
.card{background:#fff;border-radius:12px;padding:10px;margin-top:10px}
.lvl{border:2px solid orange;border-radius:10px;padding:10px;display:flex;justify-content:space-between;margin:6px 0;background:#fffde7;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}
.cell{height:50px;background:#fff8e1;border:2px solid orange;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer}
.cell.done{background:#a5d6a7}
#fall{height:400px;background:#81d4fa;border-radius:12px;position:relative;overflow:hidden;border:3px solid #0277bd;display:none}
.bub{position:absolute;background:yellow;border:3px solid red;padding:10px 15px;border-radius:20px;font-weight:bold;cursor:pointer}
.ad{border:2px dashed orange;min-height:50px;background:#fffde7;border-radius:8px;display:flex;align-items:center;justify-content:center;margin:8px 0}
.bar{height:6px;background:green}
.btn{width:100%;padding:10px;background:green;color:#fff;border:none;border-radius:20px;margin-top:8px}
.foot{position:fixed;bottom:0;left:0;right:0;background:#fff;height:55px;display:flex;align-items:center;justify-content:center;border-top:3px solid green}
</style>
</head>
<body>
<div class="main">
<div class="top"><h1>🌾 ਪੰਜਾਬੀ ਟਾਫੀ ਕ੍ਰਸ਼</h1></div>
<div class="ad"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1905215538239803" data-ad-slot="1111111111" data-ad-format="auto"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script></div>
<div class="card" id="menu">
<div class="lvl" onclick="start(0)"><span>🍪 L1 Cookie</span><b>PLAY</b></div>
<div class="lvl" onclick="start(1)"><span>✈️ L2 UDA AIDA</span><b>PLAY</b></div>
<div class="lvl" onclick="start(2)"><span>🍩 L3 Cookie 2</span><b>PLAY</b></div>
<div class="lvl" onclick="start(3)"><span>🏠 L4 GHAR PAANI</span><b>PLAY</b></div>
<div class="lvl" onclick="start(4)"><span>⭐ L5 Hard Cookie</span><b>PLAY</b></div>
<div class="lvl" onclick="start(5)"><span>🍌 L6 KELA ANGOOR</span><b>PLAY</b></div>
</div>
<div class="card" id="game" style="display:none">
<div style="display:flex;justify-content:space-between"><button onclick="showMenu()">⬅️ Back</button><b id="ln"></b><span>⭐<span id="sc">0</span> ⏰<span id="tm">0</span></span></div>
<div class="bar" id="bar" style="width:100%"></div>
<div id="g" class="grid"></div>
<div id="fall"></div>
<div class="ad"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1905215538239803" data-ad-slot="2222222222" data-ad-format="auto"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script></div>
<div id="win" style="display:none;text-align:center;background:#e8f5e9;padding:8px;border-radius:10px;border:2px solid green"><h3>Jeet gaye!</h3><button class="btn" onclick="nextL()">Next</button></div>
<div id="lose" style="display:none;text-align:center;background:#ffebee;padding:8px;border-radius:10px;border:2px solid red"><h3>Time Over</h3><button class="btn" style="background:red" onclick="retry()">Retry</button></div>
</div>
</div>
<div class="foot"><ins class="adsbygoogle" style="display:inline-block;width:320px;height:50px" data-ad-client="ca-pub-1905215538239803" data-ad-slot="3333333333"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script></div>
<script>
let cur=0,sc=0,tl=0,t1,t2,t3;
function showMenu(){clearInterval(t1);clearInterval(t2);clearInterval(t3);document.getElementById('game').style.display='none';document.getElementById('menu').style.display='block';}
function start(n){
cur=n;sc=0;clearInterval(t1);clearInterval(t2);clearInterval(t3);
document.getElementById('sc').innerText=0;document.getElementById('menu').style.display='none';document.getElementById('game').style.display='block';
document.getElementById('win').style.display='none';document.getElementById('lose').style.display='none';
document.getElementById('g').innerHTML='';document.getElementById('fall').innerHTML='';document.getElementById('bar').style.width='100%';
let cfg=[{name:"L1 Cookie",need:12,time:60,type:"grid"},{name:"L2 UDA AIDA",need:8,time:30,type:"speak",words:["UDA","AIDA"],other:["MITTI","KHET"]},{name:"L3 Cookie",need:15,time:50,type:"grid"},{name:"L4 GHAR PAANI",need:10,time:30,type:"speak",words:["GHAR","PAANI"],other:["UDA","AIDA"]},{name:"L5 Hard",need:18,time:40,type:"grid"},{name:"L6 KELA",need:8,time:30,type:"speak",words:["KELA","ANGOOR"],other:["SEB","AAM"]}][n];
document.getElementById('ln').innerText=cfg[n].name;tl=cfg[n].time;document.getElementById('tm').innerText=tl;
if(cfg[n].type=="grid"){
document.getElementById('g').style.display='grid';document.getElementById('fall').style.display='none';
let g=document.getElementById('g');let em=['🍪','🍭','🧁','🍩'];
for(let i=0;i<36;i++){let d=document.createElement('div');d.className='cell';d.innerText=em[i%4];d.onclick=function(){if(this.classList.contains('done'))return;this.innerText='🍬';this.classList.add('done');sc++;document.getElementById('sc').innerText=sc;if(sc>=cfg[n].need){clearInterval(t3);document.getElementById('win').style.display='block';}};g.appendChild(d);}
}else{
document.getElementById('g').style.display='none';document.getElementById('fall').style.display='block';
let b=document.getElementById('fall');let target=cfg[n].words[0];
t1=setInterval(()=>{let x=document.createElement('div');x.className='bub';x.innerText=Math.random()<0.6?target:cfg[n].other[Math.floor(Math.random()*cfg[n].other.length)];x.style.left=Math.floor(Math.random()*200)+'px';x.style.top='0px';x.onclick=function(){if(this.innerText===target){sc++;document.getElementById('sc').innerText=sc;this.remove();if(sc>=cfg[n].need){clearInterval(t1);clearInterval(t2);clearInterval(t3);document.getElementById('win').style.display='block';}}else{this.remove();}};b.appendChild(x);},650);
t2=setInterval(()=>{b.querySelectorAll('.bub').forEach(e=>{let tp=parseInt(e.style.top)||0;e.style.top=(tp+4)+'px';if(tp>360)e.remove();});},30);
}
t3=setInterval(()=>{tl--;document.getElementById('tm').innerText=tl;document.getElementById('bar').style.width=(tl/cfg[n].time*100)+'%';if(tl<=0){clearInterval(t1);clearInterval(t2);clearInterval(t3);document.getElementById('lose').style.display='block';}},1000);
}
function nextL(){if(cur<5)start(cur+1);else showMenu();}
function retry(){start(cur);}
</script>
</body>
</html>
