<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>punjabi toffee crush game</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1905215538239803" crossorigin="anonymous"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:linear-gradient(#87CEEB,#FFEB3B);min-height:100vh;padding-bottom:110px}
.box{max-width:420px;margin:12px auto;background:#fff;border-radius:22px;padding:15px;border:4px solid #FF9800;text-align:center}
.btn{background:orange;color:#fff;border:0;padding:14px;width:100%;border-radius:30px;font-weight:900;font-size:17px;margin-top:10px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;background:#FFF3E0;padding:8px;border-radius:12px;margin:10px 0}
.c{background:#fff;border-radius:10px;height:54px;display:flex;align-items:center;justify-content:center;font-size:28px;border:2px solid #FFCC02;cursor:pointer}
.c.ok{background:#4CAF50!important;color:#fff!important}
.bubbles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0}
.bub{background:#03A9F4;width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;font-weight:900;border:3px solid #fff;cursor:pointer}
.bar{width:100%;height:16px;background:#eee;border-radius:10px;overflow:hidden;border:2px solid orange;margin:8px 0}
.f{height:100%;background:green;width:0%;transition:0.4s}
.hidden{display:none}
#ad{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:4px solid orange;height:100px;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>

<div class="box" id="menu">
<h1 style="color:#FF6F00">ਪੰਜਾਬੀ ਟਾਫੀ</h1>
<p style="color:#E91E63;font-weight:900">punjabi toffee crush game</p>
<p style="font-size:13px;color:#555">Menu - Jaisa Decide Kiya Tha</p>
<button class="btn" onclick="start(1)">▶️ Level 1 - Toffee Crush</button>
<button class="btn" style="background:#2196F3" onclick="start(2)">🫧 Level 2 - Ura Aira Bubble ੳ ਅ ੲ</button>
<button class="btn" style="background:#4CAF50" onclick="start(3)">📚 Level 3 - ਕ ਖ ਗ</button>
</div>

<div class="box hidden" id="game">
<div style="display:flex;justify-content:space-between;font-weight:900"><span id="lv">Level 1</span><span id="sc">0/9</span></div>
<div class="bar"><div id="pf" class="f"></div></div>
<p id="msg" style="color:#E91E63;font-weight:900"></p>
<div id="area"></div>
<button class="btn" style="background:#2196F3" onclick="nextLevel()">Next Level ⏭️</button>
<button class="btn" style="background:gray" onclick="showMenu()">Menu ⬅️</button>
</div>

<div id="ad"><ins class="adsbygoogle" style="display:inline-block;width:320px;height:90px" data-ad-client="ca-pub-1905215538239803" data-ad-slot="1234567890"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script></div>

<script>
let level=1,score=0,sel=[],board=[],audio;
function sound(f){try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=f;g.gain.value=0.3;o.start();o.stop(audio.currentTime+0.2);}catch(e){}}
function showMenu(){document.getElementById('menu').classList.remove('hidden');document.getElementById('game').classList.add('hidden');}
function start(l){level=l;document.getElementById('menu').classList.add('hidden');document.getElementById('game').classList.remove('hidden');sound(800);make();}
function nextLevel(){level++;if(level>3)level=1;make();}
function make(){
let area=document.getElementById('area');area.innerHTML='';sel=[];score=0;
document.getElementById('lv').innerText='Level '+level;
document.getElementById('sc').innerText='0/9';document.getElementById('pf').style.width='0%';
if(level==1){
document.getElementById('msg').innerText='3 same toffee chuno 🍪🍪🍪';
let icons=["🍪","🍩","🧁"],p=[];for(let j=0;j<3;j++)for(let i=0;i<9;i++)p.push(icons[j]);p.sort(()=>Math.random()-0.5);board=p;
let g=document.createElement('div');g.className='grid';
for(let i=0;i<27;i++){let d=document.createElement('div');d.className='c';d.innerText=p[i];
d.onclick=function(){if(this.classList.contains('ok'))return;sound(600);this.style.background='#FCE4EC';sel.push(i);
if(sel.length==3){let a=board[sel[0]],b=board[sel[1]],c=board[sel[2]],all=g.querySelectorAll('.c');
if(a==b&&b==c){sound(900);sel.forEach(s=>{all[s].innerText='✅';all[s].className='c ok';});score++;document.getElementById('sc').innerText=score+'/9';document.getElementById('pf').style.width=score/9*100+'%';sel=[];if(score>=9){sound(1200);setTimeout(()=>{alert('Level 1 Complete!');nextLevel();},500);}}
else{let t=[...sel];setTimeout(()=>{t.forEach(s=>all[s].style.background='#fff');},300);sel=[];}}};g.appendChild(d);}area.appendChild(g);
}else if(level==2){
document.getElementById('msg').innerText='Ura Aira Bubble Phodo - ੳ ਅ ੲ 🫧';
let target=["ੳ","ਅ","ੲ"],p=[];for(let i=0;i<9;i++)p.push(target[i%3]);for(let i=0;i<7;i++)p.push(["ਸ","ਹ","ਕ"][Math.floor(Math.random()*3)]);p.sort(()=>Math.random()-0.5);
let g=document.createElement('div');g.className='bubbles';
p.forEach(ch=>{let b=document.createElement('div');b.className='bub';b.innerText=ch;
b.onclick=function(){if(target.includes(ch)){sound(900);this.innerText='✅';this.style.background='green';score++;document.getElementById('sc').innerText=score+'/9';document.getElementById('pf').style.width=score/9*100+'%';if(score>=9){sound(1200);setTimeout(()=>{alert('Ura Aira Complete!');nextLevel();},500);}}else{sound(200);}};g.appendChild(b);});area.appendChild(g);
}else{
document.getElementById('msg').innerText='ਕ ਖ ਗ - Akhar Seekho 📚';
let icons=["ਕ","ਖ","ਗ"],p=[];for(let j=0;j<3;j++)for(let i=0;i<9;i++)p.push(icons[j]);p.sort(()=>Math.random()-0.5);board=p;
let g=document.createElement('div');g.className='grid';
for(let i=0;i<27;i++){let d=document.createElement('div');d.className='c';d.innerText=p[i];d.style.fontSize='26px';
d.onclick=function(){if(this.classList.contains('ok'))return;sound(600);sel.push(i);this.style.background='#FCE4EC';
if(sel.length==3){let a=board[sel[0]],b=board[sel[1]],c=board[sel[2]],all=g.querySelectorAll('.c');
if(a==b&&b==c){sound(900);sel.forEach(s=>{all[s].innerText='✅';all[s].className='c ok';});score++;document.getElementById('sc').innerText=score+'/9';document.getElementById('pf').style.width=score/9*100+'%';sel=[];if(score>=9){sound(1200);setTimeout(()=>{alert('All Complete!');showMenu();},500);}}else{let t=[...sel];setTimeout(()=>{t.forEach(s=>all[s].style.background='#fff');},300);sel=[];}}};g.appendChild(d);}area.appendChild(g);
}}
</script>
</body>
</html>
