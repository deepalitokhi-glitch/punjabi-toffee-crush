<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Punjabi Toffee Fixed</title>
<style>
body{margin:0;background:#c8e6c9;font-family:Arial;display:flex;justify-content:center}
.main{width:400px;max-width:100%;padding:10px}
.top{background:#fff;border-radius:12px;padding:10px;text-align:center;border:3px solid orange}
.card{background:#fff;border-radius:12px;padding:10px;margin-top:10px}
.lvl{border:2px solid orange;border-radius:8px;padding:10px;margin:6px 0;display:flex;justify-content:space-between;background:#fffde7}
#game{display:none}
#fall{height:400px;background:#4fc3f7;border-radius:12px;position:relative;overflow:hidden;border:3px solid #0288d1;margin-top:10px;display:none}
.bub{position:absolute;background:yellow;padding:10px 16px;border-radius:20px;border:3px solid red;font-weight:bold;font-size:18px;cursor:pointer;left:0;top:0}
.speaker{background:#ffecb3;border:2px solid orange;border-radius:10px;padding:8px;text-align:center;margin:6px 0;display:none}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}
.cell{background:#fff8e1;border:2px solid orange;border-radius:8px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:24px}
</style>
</head>
<body>
<div class="main">
<div class="top"><h1>🌾 ਪੰਜਾਬੀ ਟਾਫੀ ਕ੍ਰਸ਼</h1><small>KAR likha - ਕਰ bolega - FIXED</small></div>

<div class="card" id="menu">
<div class="lvl" onclick="start(0)"><span>🍪 L1 Cookie 12 toffee</span><b>PLAY</b></div>
<div class="lvl" onclick="start(1)"><span>✈️ L2 UDA AIDA</span><b>PLAY</b></div>
<div class="lvl" onclick="start(2)"><span>🍩 L3 Cookie 2</span><b>PLAY</b></div>
<div class="lvl" onclick="start(3)"><span>🏠 L4 KAR MAR GHAR</span><b>PLAY</b></div>
<div class="lvl" onclick="start(4)"><span>⭐ L5 Hard Cookie</span><b>PLAY</b></div>
<div class="lvl" onclick="start(5)"><span>🍌 L6 KELA ANGOOR</span><b>PLAY</b></div>
</div>

<div class="card" id="game">
<button onclick="document.getElementById('game').style.display='none';document.getElementById('menu').style.display='block'">⬅️ Back</button> <b id="ln"></b> ⭐<span id="sc">0</span> ⏰<span id="tm">30</span>
<div style="height:5px;background:green" id="bar"></div>
<div class="speaker" id="spBox">Suno: <b id="sayEng">KAR</b> (<span id="sayPbi">ਕਰ</span>) <button onclick="speakAgain()">🔊</button></div>
<div class="grid" id="g"></div>
<div id="fall"></div>
<div id="win" style="display:none;background:#e8f5e9;padding:10px;text-align:center;margin-top:10px">Jeet gaye! <button onclick="nextL()">Next</button></div>
<div id="lose" style="display:none;background:#ffebee;padding:10px;text-align:center;margin-top:10px">Time over! <span id="fsc">0</span> <button onclick="retry()">Retry</button></div>
</div>
</div>

<script>
let cur=0,sc=0,tl=0,t1,t2,t3,currentEng="";
let map={"KAR":"ਕਰ","MAR":"ਮਰ","GHAR":"ਘਰ","PAANI":"ਪਾਣੀ","UDA":"ਉਡਾ","AIDA":"ਐਦਾ","KELA":"ਕੇਲਾ","ANGOOR":"ਅੰਗੂਰ"};
function speak(e){currentEng=e;document.getElementById('sayEng').innerText=e;document.getElementById('sayPbi').innerText=map[e]||e;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(map[e]||e);u.lang='pa-IN';u.rate=0.8;speechSynthesis.speak(u);}catch(err){}}
function speakAgain(){if(currentEng)speak(currentEng);}
function start(n){
 cur=n;sc=0;clearInterval(t1);clearInterval(t2);clearInterval(t3);
 document.getElementById('menu').style.display='none';document.getElementById('game').style.display='block';
 document.getElementById('g').innerHTML='';document.getElementById('g').style.display='none';document.getElementById('fall').innerHTML='';document.getElementById('fall').style.display='none';
 document.getElementById('spBox').style.display='none';document.getElementById('win').style.display='none';document.getElementById('lose').style.display='none';
 document.getElementById('sc').innerText=0;
 let cfg=[
  {name:"L1 Cookie",need:3,time:60,type:"grid",emoji:['🍪','🍭']},
  {name:"L2 UDA AIDA",need:5,time:30,type:"speak",words:["UDA","AIDA"],other:["MITTI","KHET"]},
  {name:"L3 Cookie",need:4,time:50,type:"grid",emoji:['🍩','🍫']},
  {name:"L4 KAR MAR",need:5,time:30,type:"speak",words:["KAR","MAR","GHAR","PAANI"],other:["UDA","KELA"]},
  {name:"L5 Hard",need:5,time:40,type:"grid",emoji:['⭐','🍪']},
  {name:"L6 KELA",need:5,time:30,type:"speak",words:["KELA","ANGOOR"],other:["SEB","AAM"]}
 ][n];
 document.getElementById('ln').innerText=cfg[n].name;tl=cfg[n].time;
 document.getElementById('tm').innerText=tl;
 t3=setInterval(()=>{tl--;document.getElementById('tm').innerText=tl;document.getElementById('bar').style.width=(tl/cfg[n].time*100)+'%';if(tl<=0){clearInterval(t1);clearInterval(t2);clearInterval(t3);document.getElementById('fsc').innerText=sc;document.getElementById('lose').style.display='block';}},1000);
 if(cfg[n].type=="grid"){grid(cfg[n]);}else{speakMode(cfg[n]);}
}
function grid(c){
 document.getElementById('g').style.display='grid';
 let g=document.getElementById('g');
 for(let i=0;i<12;i++){let d=document.createElement('div');d.className='cell';d.innerText=c.emoji[i%2];d.onclick=()=>{d.innerText='🍬';sc++;document.getElementById('sc').innerText=sc;if(sc>=c.need){clearInterval(t3);document.getElementById('win').style.display='block';}};g.appendChild(d);}
}
function speakMode(c){
 document.getElementById('spBox').style.display='block';let b=document.getElementById('fall');b.style.display='block';
 let target=c.words[0];speak(target);
 t1=setInterval(()=>{
  let x=document.createElement('div');x.className='bub';
  let ok=Math.random()<0.5; x.innerText=ok?target:c.other[Math.floor(Math.random()*c.other.length)];
  x.style.left=Math.floor(Math.random()*200)+'px';x.style.top='0px';
  x.onclick=()=>{if(x.innerText===target){sc++;document.getElementById('sc').innerText=sc;x.remove();if(sc>=c.need){clearInterval(t1);clearInterval(t2);clearInterval(t3);document.getElementById('win').style.display='block';}else{target=c.words[Math.floor(Math.random()*c.words.length)];speak(target);}}else{x.style.background='red';setTimeout(()=>x.remove(),300);}};
  b.appendChild(x);
 },700);
 t2=setInterval(()=>{b.querySelectorAll('.bub').forEach(e=>{let t=parseInt(e.style.top)||0;e.style.top=(t+4)+'px';if(t>380)e.remove();});},30);
}
function nextL(){if(cur<5)start(cur+1);else{document.getElementById('game').style.display='none';document.getElementById('menu').style.display='block';}}
function retry(){start(cur);}
</script>
</body>
</html>
