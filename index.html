<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Punjabi Games FINAL 2026</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:manipulation}body{font-family:sans-serif;background:#000;overflow:hidden}
#app{width:100vw;height:100vh;position:relative;background:url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=900') center/cover}
#app::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,153,51,0.4),rgba(46,125,50,0.5))}
.screen{position:relative;z-index:2;width:100%;height:100%;display:none;flex-direction:column;align-items:center;padding:12px}.screen.active{display:flex}
.topbar{width:100%;max-width:400px;display:flex;justify-content:space-between;background:#fff;padding:10px 16px;border-radius:14px;font-weight:800}
.btn{border:none;border-radius:30px;padding:12px 22px;font-weight:800}.btn:active{transform:scale(0.94)}.btn-p{background:#E91E63;color:#fff}.btn-g{background:#2E7D32;color:#fff}
.menu-card{background:#fff;width:92%;max-width:380px;border-radius:24px;padding:20px;text-align:center;margin-top:30px}
#board{width:92vw;max-width:380px;aspect-ratio:1;background:#fff;border-radius:18px;padding:6px;display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.candy{font-size:26px;display:flex;align-items:center;justify-content:center;background:#FFF8E1;border-radius:10px}.candy.sel{background:#FFECB3;outline:3px solid #FF6F00;transform:scale(1.15)}
#udaCanvas{width:92vw;max-width:380px;height:60vh;background:linear-gradient(#87CEEB,#C8E6C9);border-radius:18px;border:4px solid #fff;margin-top:8px}
.popup{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:20;display:none;align-items:center;justify-content:center}.popup.show{display:flex}.card{background:#fff;border-radius:22px;padding:20px;text-align:center;width:90%;max-width:340px}
.adbox{background:#FFF8E1;border:2px dashed #FF9800;border-radius:12px;padding:12px;margin:10px 0;font-size:12px}
</style>
</head><body>
<div id="app">
<div id="menu" class="screen active"><div class="menu-card"><h1>🌾 Punjabi Games 🍬</h1><p>Menu + Sound + Ad Ready</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0"><div style="background:#FFF8E1;border-radius:16px;padding:14px" onclick="startLevel(1)"><div style="font-size:38px">🍪</div><b>Level 1</b></div><div style="background:#FFF8E1;border-radius:16px;padding:14px" onclick="startLevel(2)"><div style="font-size:38px">🪁</div><b>Level 2</b></div></div><button class="btn btn-p" style="width:100%;padding:14px;font-size:18px" onclick="startLevel(1)">▶️ Play Now</button><p style="font-size:10px;margin-top:8px;color:#888">1 Ad Only on Level Complete - Earning: ₹ + $</p></div></div>
<div id="level1" class="screen"><div class="topbar"><div>🍪 Toffee Crush</div><div><span id="s1score">0</span> | <span id="s1moves">25</span></div></div><div id="board"></div><div style="margin-top:12px;display:flex;gap:10px"><button class="btn btn-g" onclick="showMenu()">🏠 Menu</button><button class="btn btn-p" onclick="createBoard()">🔄 New</button></div></div>
<div id="level2" class="screen"><div class="topbar"><div>🪁 Punjabi Uda</div><div>Score: <span id="s2score">0</span></div></div><canvas id="udaCanvas"></canvas><div style="margin-top:10px;display:flex;gap:10px"><button class="btn btn-g" onclick="showMenu()">🏠 Menu</button><button class="btn btn-p" id="udaTapBtn">👆 TAP</button></div></div>
<div id="adPopup" class="popup"><div class="card"><div style="font-size:48px">🎉</div><h2 id="popTitle">Level Complete!</h2><p id="popMsg">Bonus!</p><div class="adbox">📢 AD SPACE<br>Yaha AdSense ID lagne ke baad har view pe Rupee+Dollar ayega<br>Ad: <span id="adTimer">5</span>s</div><button class="btn btn-p" style="width:100%" id="claimBtn" onclick="goNext()">Next Level (<span id="claimTimer">5</span>)</button></div></div>
</div>
<script>
let nextLevel=2,adInterval;function showMenu(){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('menu').classList.add('active');stopUda()}function startLevel(n){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('level'+n).classList.add('active');if(n==1)createBoard();if(n==2)initUda()}
const EMOJIS=["🍪","🧁","🍩","🍭","🍫","🧇","🍬","🥨"];const SIZE=8;let board=[],score=0,moves=25,selected=null,swapping=false;const boardEl=document.getElementById('board');
function rand(){return EMOJIS[Math.floor(Math.random()*EMOJIS.length)]}function createBoard(){board=[];for(let r=0;r<SIZE;r++){let row=[];for(let c=0;c<SIZE;c++){let e;do{e=rand()}while((c>=2&&row[c-1]==e&&row[c-2]==e)||(r>=2&&board[r-1][c]==e&&board[r-2][c]==e));row.push(e)}board.push(row)}score=0;moves=25;selected=null;update1();render1()}
function render1(){boardEl.innerHTML='';for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){const d=document.createElement('div');d.className='candy';d.textContent=board[r][c];if(selected&&selected.r==r&&selected.c==c)d.classList.add('sel');d.onclick=()=>clickCandy(r,c);boardEl.appendChild(d)}}
function clickCandy(r,c){if(swapping||moves<=0)return;if(!selected){selected={r,c};render1();return}if(selected.r==r&&selected.c==c){selected=null;render1();return}if(Math.abs(selected.r-r)+Math.abs(selected.c-c)==1)doSwap(selected.r,selected.c,r,c);else{selected={r,c};render1()}}
async function doSwap(r1,c1,r2,c2){swapping=true;let t=board[r1][c1];board[r1][c1]=board[r2][c2];board[r2][c2]=t;render1();await sleep(150);let m=findMatches();if(m.length>0){moves--;selected=null;await clearMatches()}else{t=board[r1][c1];board[r1][c1]=board[r2][c2];board[r2][c2]=t;selected=null;render1();swapping=false}}
function findMatches(){let set=new Set(),list=[];for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE-2;c++)if(board[r][c]&&board[r][c]==board[r][c+1]&&board[r][c]==board[r][c+2])[[r,c],[r,c+1],[r,c+2]].forEach(p=>{let k=p[0]+','+p[1];if(!set.has(k)){set.add(k);list.push(p)}});for(let c=0;c<SIZE;c++)for(let r=0;r<SIZE-2;r++)if(board[r][c]&&board[r][c]==board[r+1][c]&&board[r][c]==board[r+2][c])[[r,c],[r+1,c],[r+2,c]].forEach(p=>{let k=p[0]+','+p[1];if(!set.has(k)){set.add(k);list.push(p)}});return list}
async function clearMatches(){while(true){let m=findMatches();if(m.length==0)break;score+=m.length*10;update1();await sleep(250);m.forEach(([r,c])=>board[r][c]=null);for(let c=0;c<SIZE;c++){let w=SIZE-1;for(let r=SIZE-1;r>=0;r--)if(board[r][c]){if(r!=w){board[w][c]=board[r][c];board[r][c]=null}w--}for(let r=w;r>=0;r--)board[r][c]=rand()}render1();await sleep(180);if(score>=500){win1();return}}swapping=false;render1();if(moves<=0&&score<500)setTimeout(()=>{alert('Score:'+score);createBoard()},200)}
function update1(){document.getElementById('s1score').textContent=score;document.getElementById('s1moves').textContent=moves}
function win1(){swapping=false;showAd('Level 1 Done! 🎉','Score: '+score,2)}
function showAd(t,m,n){document.getElementById('popTitle').textContent=t;document.getElementById('popMsg').textContent=m;nextLevel=n;document.getElementById('adPopup').classList.add('show');let tt=5;document.getElementById('adTimer').textContent=tt;document.getElementById('claimTimer').textContent=tt;document.getElementById('claimBtn').disabled=true;clearInterval(adInterval);adInterval=setInterval(()=>{tt--;document.getElementById('adTimer').textContent=tt;document.getElementById('claimTimer').textContent=tt;if(tt<=0){clearInterval(adInterval);document.getElementById('claimBtn').disabled=false;document.getElementById('claimBtn').innerHTML='Next Level 👉';}},1000)}
function goNext(){clearInterval(adInterval);document.getElementById('adPopup').classList.remove('show');if(nextLevel==2)startLevel(2);else showMenu()}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
let canvas,ctx,udaRunning=false,udaScore=0,bird={x:60,y:200,vy:0},pipes=[],frame=0,raf;function initUda(){canvas=document.getElementById('udaCanvas');ctx=canvas.getContext('2d');canvas.width=canvas.offsetWidth;canvas.height=canvas.offsetHeight;bird={x:60,y:canvas.height/2,vy:0};pipes=[];udaScore=0;frame=0;udaRunning=true;loopUda()}
function stopUda(){udaRunning=false;if(raf)cancelAnimationFrame(raf)}
function loopUda(){if(!udaRunning)return;frame++;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#A5D6A7';ctx.fillRect(0,canvas.height-40,canvas.width,40);bird.vy+=0.45;bird.y+=bird.vy;if(bird.y>canvas.height-50){gameOverUda();return}ctx.font='34px serif';ctx.fillText('🪁',bird.x-10,bird.y+10);if(frame%90==0)pipes.push({x:canvas.width,h:Math.random()*(canvas.height*0.5)+40,gap:135});ctx.font='30px serif';for(let i=pipes.length-1;i>=0;i--){let p=pipes[i];p.x-=3;ctx.fillText('🥁',p.x,p.h-15);ctx.fillText('🥁',p.x,p.h+p.gap+20);if(p.x<bird.x+22&&p.x+30>bird.x&&(bird.y<p.h||bird.y>p.h+p.gap-20)){gameOverUda();return}if(p.x<-40){pipes.splice(i,1);udaScore+=10;document.getElementById('s2score').textContent=udaScore;if(udaScore>=100){winUda();return}}}raf=requestAnimationFrame(loopUda)}
function flap(){if(!udaRunning)return;bird.vy=-8}function gameOverUda(){udaRunning=false;setTimeout(()=>{if(confirm('Game Over! Score:'+udaScore+' Retry?'))initUda();else showMenu()},100)}function winUda(){udaRunning=false;showAd('Uda Complete! 🪁','Score:'+udaScore,1)}
document.addEventListener('DOMContentLoaded',()=>{let c=document.getElementById('udaCanvas');if(c){c.addEventListener('touchstart',e=>{e.preventDefault();flap()},{passive:false});c.addEventListener('mousedown',flap)}let
