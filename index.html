<!DOCTYPE html>
<html lang="pa" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="google" content="notranslate">
<title>Punjabi Toffee Crush V25</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{margin:0;background:#87CEEB;min-height:100vh;display:flex;justify-content:center;align-items:center}
#startScreen{position:fixed;inset:0;background:url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=800') center/cover;display:flex;justify-content:center;align-items:center;z-index:999}
.box{background:#fff;border-radius:20px;padding:20px;width:90%;max-width:340px;text-align:center;border:3px solid #ff9800;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.playBtn{width:100%;background:linear-gradient(90deg,#ff9800,#ff4081);color:#fff;border:none;padding:14px;border-radius:30px;font-weight:900;font-size:18px;margin-top:12px;cursor:pointer}
#menuScreen{display:none;position:fixed;inset:0;background:url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=800') center/cover;justify-content:center;align-items:center;z-index:998;padding:10px}
.menuBox{background:#fff;border-radius:16px;padding:12px;width:100%;max-width:400px;max-height:90vh;overflow-y:auto;text-align:center;border:2px solid #ff9800}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.lvl{border:2px solid #ff9800;background:#fff8e1;border-radius:12px;padding:10px 2px;font-weight:bold;font-size:12px;min-height:75px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.lvl.locked{background:#ccc;opacity:.6;pointer-events:none}
#gameScreen{display:none;position:fixed;inset:0;background:#fff;z-index:997;padding:8px;overflow-y:auto;align-items:flex-start;justify-content:center}
.gameBox{background:#fff;width:100%;max-width:420px;margin:0 auto;text-align:center;padding-bottom:70px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;background:#fff3e0;padding:6px;border-radius:10px;margin:8px 0}
.cell{aspect-ratio:1;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid #ffcc02;cursor:pointer}
.cell.sel{border-color:#ff4081;background:#fce4ec;transform:scale(1.05)}
.cell.done{background:#c8e6c9;opacity:.3;pointer-events:none}
#fall{position:relative;width:100%;height:400px;background:#fffde7;border-radius:10px;overflow:hidden;margin:8px 0;display:none;border:2px solid #ff9800}
.bubble{position:absolute;background:#fff;border-radius:30px;padding:10px 14px;border:2px solid #ff4081;font-weight:900;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.3);font-size:16px;white-space:nowrap}
#win{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;justify-content:center;align-items:center;z-index:1000;padding:15px}
.winBox{background:#fff;border-radius:16px;padding:20px;width:90%;max-width:300px;text-align:center;border:3px solid #4caf50}
.btn{width:100%;background:#4caf50;color:#fff;border:none;padding:12px;border-radius:30px;font-weight:bold;margin-top:8px;cursor:pointer}
.btn2{background:linear-gradient(90deg,#ff9800,#ff4081)}
</style>
</head>
<body>
<div id="startScreen">
<div class="box">
<div style="font-size:50px">🍬🌾</div>
<div style="font-size:28px;font-weight:900;color:#e65100">ਪੰਜਾਬੀ ਟਾਫੀ</div>
<div style="font-size:14px;color:#ff4081;font-weight:bold">Punjabi Toffee Crush</div>
<div style="font-size:11px;background:#fff8e1;padding:8px;border-radius:10px;margin:10px 0">🌾 ਸਰਸੋਂ ਦੇ ਖੇਤਾਂ ਵਾਲਾ<br>ਦੇਸੀ ਪੰਜਾਬੀ ਗੇਮ 🌾</div>
<button class="playBtn" onclick="goMenu()">▶️ ਗੇਮ ਸ਼ੁਰੂ ਕਰੋ ਜੀ</button>
</div>
</div>
<div id="menuScreen">
<div class="menuBox">
<h2 style="color:#e65100">🌾 ਪੰਜਾਬੀ ਟਾਫੀ</h2>
<p style="font-size:11px;color:#666">ਲੈਵਲ ਚੁਣੋ ਜੀ - Serial Wise</p>
<div class="levels" id="lvList"></div>
<button onclick="resetGame()" style="background:#ffcdd2;border:none;padding:6px 12px;border-radius:15px;font-size:10px;margin-top:6px">🔓 Reset All</button>
</div>
</div>
<div id="gameScreen">
<div class="gameBox">
<div style="display:flex;justify-content:space-between;font-weight:bold;font-size:13px;padding:6px 0"><button onclick="goMenu()" style="border:none;background:#eee;padding:5px 12px;border-radius:15px">⬅️ ਮੀਨੂ</button><span id="lvName"></span><span id="score" style="color:#e91e63"></span></div>
<p id="hint" style="font-size:12px;color:#e91e63;font-weight:bold;margin:6px 0"></p>
<div class="grid" id="grid"></div>
<div id="fall"></div>
</div>
</div>
<div id="win">
<div class="winBox">
<div style="font-size:40px">🎉🏆</div>
<h2 id="winTitle" style="color:#4caf50;font-size:18px">ਵਾਹ ਜੀ ਵਾਹ!</h2>
<p id="winMsg" style="font-size:12px;margin:8px 0"></p>
<p style="background:#e8f5e9;padding:6px;border-radius:8px;font-size:12px">Score: <b id="winScore"></b></p>
<button class="btn btn2" onclick="nextLevel()">▶️ ਅਗਲਾ ਲੈਵਲ</button>
<button class="btn" onclick="replay()">🔄 ਦੁਬਾਰਾ ਖੇਡੋ</button>
<button class="btn" style="background:#eee;color:#333" onclick="goMenu()">🏠 ਮੀਨੂ</button>
</div>
</div>
<script>
var LEVELS=[
{name:"ਲੈਵਲ 1",type:"grid",target:"🍪",punjabi:"ਕੂਕੀ",items:["🍪","🧁","🍫","🍩"],need:12,hint:"3 ਕੂਕੀ ਚੁਣੋ ਜੀ! 🍪🍪🍪"},
{name:"ਲੈਵਲ 2",type:"fall",target:"ਊੜਾ",punjabi:"ਊੜਾ",items:["ਊੜਾ","ਪਿੰਡ","ਖੇਡ"],need:10,hint:"ਊੜਾ ਫੜੋ ਜੀ! 🍬 ਊੜਾ"},
{name:"ਲੈਵਲ 3",type:"grid",target:"🍎",punjabi:"ਸੇਬ",items:["🍎","🍓","🍇","🍊"],need:12,hint:"3 ਸੇਬ ਚੁਣੋ ਜੀ! 🍎🍎🍎"},
{name:"ਲੈਵਲ 4",type:"fall",target:"ਅਨਾਰ",punjabi:"ਅਨਾਰ",items:["ਅਨਾਰ","ਅੰਬ","ਅੰਗੂਰ"],need:10,hint:"ਅਨਾਰ ਫੜੋ ਜੀ! 🍬 ਅਨਾਰ"},
{name:"ਲੈਵਲ 5",type:"grid",target:"🍦",punjabi:"ਆਈਸ ਕਰੀਮ",items:["🍦","🧁","🍪"],need:12,hint:"3 ਆਈਸ ਕਰੀਮ ਚੁਣੋ ਜੀ! 🍦🍦🍦"},
{name:"ਲੈਵਲ 6",type:"fall",target:"ਮਿੱਟੀ",punjabi:"ਮਿੱਟੀ",items:["ਮਿੱਟੀ","ਪਾਣੀ","ਬੋਲੀ"],need:10,hint:"ਮਿੱਟੀ ਫੜੋ ਜੀ! 🍬 ਮਿੱਟੀ"}
];
var cur=0,score=0,sel=[],board=[],sInt=null,fInt=null;
function getUnlocked(){return parseInt(localStorage.getItem('punjabi_unlock_v25')||'1');}
function setUnlocked(n){localStorage.setItem('punjabi_unlock_v25',n);showLevels();}
function resetGame(){localStorage.setItem('punjabi_unlock_v25','1');showLevels();}
function goMenu(){
clearInterval(sInt);clearInterval(fInt);
document.getElementById('startScreen').style.display='none';
document.getElementById('gameScreen').style.display='none';
document.getElementById('win').style.display='none';
document.getElementById('menuScreen').style.display='flex';
showLevels();
}
function showLevels(){
var el=document.getElementById('lvList');el.innerHTML='';
var un=getUnlocked();
for(var i=0;i<LEVELS.length;i++){
var lv=LEVELS[i];
var d=document.createElement('div');d.className='lvl';
if(i+1>un)d.className+=' locked';
d.innerHTML='<b>'+lv.name+'</b><br><span style="font-size:20px">'+lv.target+'</span><br><small style="font-size:9px">'+lv.punjabi+'</small>'+(i+1<un?'<br>✅':'')+(i+1==un?'<br>▶️':'');
(function(idx){d.onclick=function(){if(idx+1>getUnlocked())return;cur=idx;startGame();};})(i);
el.appendChild(d);
}
}
function startGame(){
clearInterval(sInt);clearInterval(fInt);
score=0;sel=[];board=[];
document.getElementById('menuScreen').style.display='none';
document.getElementById('gameScreen').style.display='flex';
document.getElementById('win').style.display='none';
var lv=LEVELS[cur];
document.getElementById('lvName').innerText=lv.name;
document.getElementById('score').innerText='0/'+lv.need;
document.getElementById('hint').innerText=lv.hint;
document.getElementById('grid').style.display=lv.type=='grid'?'grid':'none';
document.getElementById('fall').style.display=lv.type=='fall'?'block':'none';
document.getElementById('fall').innerHTML='';
if(lv.type=='grid')initGrid(lv);else initFall(lv);
}
function initGrid(lv){
var g=document.getElementById('grid');g.innerHTML='';sel=[];
var pool=[];
for(var j=0;j<3;j++){for(var k=0;k<12;k++)pool.push(lv.items[j%lv.items.length]);}
pool.sort(function(){return Math.random()-0.5;});
board=pool.slice();
for(var i=0;i<pool.length;i++){
var c=document.createElement('div');c.className='cell';c.innerText=pool[i];
(function(idx){
c.onclick=function(){
if(this.classList.contains('done')||this.classList.contains('sel'))return;
this.classList.add('sel');sel.push(idx);
if(sel.length==3){
var v1=board[sel[0]],v2=board[sel[1]],v3=board[sel[2]];
var cells=document.querySelectorAll('.cell');
if(v1==v2&&v2==v3){
for(var s=0;s<sel.length;s++){cells[sel[s]].innerText='🍬';cells[sel[s]].classList.remove('sel');cells[sel[s]].classList.add('done');}
score++;document.getElementById('score').innerText=score+'/'+lv.need;
sel=[];
if(score>=lv.need){setTimeout(showWin,300);}
}else{
var tmp=sel.slice();
setTimeout(function(){for(var t=0;t<tmp.length;t++){cells[tmp[t]].classList.remove('sel');}},400);
sel=[];
}
}
};
})(i);
g.appendChild(c);
}
}
function initFall(lv){
var area=document.getElementById('fall');area.innerHTML='';
function spawn(){
var d=document.createElement('div');d.className='bubble';
var isT=Math.random()<0.6;
var w=isT?lv.target:lv.items[Math.floor(Math.random()*lv.items.length)];
d.textContent='🍬 '+w;
d.style.left=Math.floor(Math.random()*60+5)+'%';
d.style.top='-20px';
d.onclick=function(){
if(w==lv.target){score++;document.getElementById('score').innerText=score+'/'+lv.need;this.remove();if(score>=lv.need)setTimeout(showWin,200);}else{this.remove();}
};
area.appendChild(d);
}
for(var i=0;i<3;i++)setTimeout(spawn,i*300);
sInt=setInterval(spawn,900);
fInt=setInterval(function(){
var bubbles=document.querySelectorAll('#fall.bubble');
for(var b=0;b<bubbles.length;b++){
var el=bubbles[b];
var t=parseFloat(el.style.top)||0;
t+=2;
el.style.top=t+'px';
if(t>380)el.remove();
}
},40);
}
function showWin(){
clearInterval(sInt);clearInterval(fInt);
var lv=LEVELS[cur];
document.getElementById('winTitle').innerText=lv.name+' ਪੂਰਾ!';
document.getElementById('winMsg').innerText=lv.punjabi+' ਪੂਰਾ ਹੋ ਗਿਆ ਜੀ, ਸ਼ਾਬਾਸ਼!';
document.getElementById('winScore').innerText=score+'/'+lv.need;
document.getElementById('win').style.display='flex';
var un=getUnlocked();
if(cur+1>=un && cur+1<LEVELS.length){setUnlocked(cur+2);}
}
function nextLevel(){document.getElementById('win').style.display='none';if(cur<LEVELS.length-1){cur++;startGame();}else{goMenu();}}
function replay(){document.getElementById('win').style.display='none';startGame();}
showLevels();
</script>
</body>
</html>
