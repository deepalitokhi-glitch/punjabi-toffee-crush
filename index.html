0;display:none}</style></head><body><div class="card" id="menu"><h2>🌾 Punjabi Games</h2><p style="font-size:11px">FINAL - All Features + Level 4 Fixed</p><div class="levels" id="levelMenu"></div><div style="font-size:10px;color:#888">Ad, Menu, Voice, Sound, Matching - All In</div></div><div class="card" id="game" style="display:none"><div class="top"><button onclick="goMenu()">⬅️ Menu</button><span id="levelTitle">Level 1</span><span>Score: <span id="score">0</span></span></div><p style="font-size:12px" id="hint">Target</p><div class="grid" id="grid"></div><div id="fallArea"></div><div class="adBox" id="adBox"><div>🎉 Level Complete! Sab Toffee ban gaye! Ad - Earning 💰<br><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="123456" data-ad-format="auto"></ins></div><button class="btn" onclick="nextLevel()">➡️ Next Level</button></div><button class="btn" style="background:#4caf50" onclick="restart()">🔄 Restart</button><div style="font-size:10px;margin-top:6px;color:#666">🔊 Sound ON | 🗣️ Voice ON | 📢 Ad ON</div></div><script>const LEVELS=[{id:1,name:"Level 1",type:"match",items:['🍪','🧁','🍭','🍫'],target:"All 🍬",desc:"3 same lao - Candy banao!"},{id:2,name:"Level 2",type:"fall",target:"UDA",words:['UDA','KHED','PIND','GUDDI'],desc:"UDA wali candy pakdo!"},{id:3,name:"Level 3",type:"match",items:['🍎','🍓','🍇','🍊'],target:"All 🍬",desc:"3 same lao - Candy banao!"},{id:4,name:"Level 4",type:"click",items:['🍪','🍦','🧁','🍩','🍫'],target:"All 🍬",desc:"Kahin bhi click karo - Cookie se Toffee banao!"},{id:5,name:"Level 5",type:"match",items:['⭐','🌙','☀️','🌈'],target:"All 🍬",desc:"3 same lao - Candy banao!"},{id:6,name:"Level 6",type:"fall",target:"MITTI",words:['MITTI','PANI','BOLI','PIND'],desc:"MITTI wali candy pakdo!"}];let cur=0,board=[],score=0,sel=null,audioCtx=null,fallInt=null,spawnInt=null;const CANDY='🍬';function getAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx}function playSound(f){try{let c=getAudio();let o=c.createOscillator();let g=c.createGain();o.frequency.value=f;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+0.25)}catch(e){}}function speak(t){try{let u=new SpeechSynthesisUtterance(t);u.lang='pa-IN';u.rate=0.8;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}function buildMenu(){let m=document.getElementById('levelMenu');m.innerHTML='';LEVELS.forEach((lv,i)=>{let d=document.createElement('div');d.className='lvl';d.innerHTML=`<span style="font-size:22px">${lv.type==='click'?'👆':lv.type==='match'?'🍪':'🍬'}</span><br><b>${lv.name}</b><br><small>${lv.target}</small>`;d.onclick=()=>startLevel(i);m.appendChild(d)});try{(adsbygoogle=window.adsbygoogle||[]).push({})}catch(e){}}buildMenu();function goMenu(){document.getElementById('game').style.display='none';document.getElementById('menu').style.display='block';stopFall()}function startLevel(i){cur=i;document.getElementById('menu').style.display='none';document.getElementById('game').style.display='block';restart()}function nextLevel(){if(cur<LEVELS.length-1)startLevel(cur+1);else{alert('All Levels Complete! 🎉');goMenu()}}function restart(){let lv=LEVELS[cur];document.getElementById('levelTitle').innerText=lv.name;document.getElementById('hint').innerText=lv.desc;document.getElementById('adBox').style.display='none';score=0;document.getElementById('score').innerText=0;document.getElementById('grid').style.display='grid';document.getElementById('fallArea').style.display='none';if(lv.type==='click')initClick(lv);else if(lv.type==='match')initMatch(lv);else initFall(lv)}function initClick(lv){board=[];let g=document.getElementById('grid');g.innerHTML='';for(let i=0;i<36;i++){let it=lv.items[Math.floor(Math.random()*lv.items.length)];board.push(it);let d=document.createElement('div');d.className='cell';d.innerText=it;d.onclick=()=>clickToToffee(i);g.appendChild(d)}speak('Level char, click karo toffee banao')}function clickToToffee(i){let cells=document.querySelectorAll('#grid.cell');if(board[i]===CANDY)return;board[i]=CANDY;cells[i].innerText=CANDY;cells[i].classList.add('candy');score++;document.getElementById('score').innerText=score+'/36';playSound(750);speak('Toffee!');if(score>=36){document.getElementById('adBox').style.display='block';playSound(1200);speak('Level complete!');try{(adsbygoogle=window.adsbygoogle||[]).push({})}catch(e){}}}function initMatch(lv){board=[];let g=document.getElementById('grid');g.innerHTML='';sel=null;for(let i=0;i<36;i++){let it=lv.items[Math.floor(Math.random()*lv.items.length)];board.push(it);let d=document.createElement('div');d.className='cell';d.innerText=it;d.onclick=()=>clickMatch(i);g.appendChild(d)}speak(lv.name)}function clickMatch(i){let cells=document.querySelectorAll('#grid.cell');if(sel===null){sel=i;cells[i].style.borderColor='#ff4081';playSound(400)}else{if(sel===i){cells[sel].style.borderColor='#ffe0b2';sel=null;return}let dist=Math.abs(sel-i);if(dist===1||dist===6){let tmp=board[sel];board[sel]=board[i];board[i]=tmp;cells[sel].innerText=board[sel];cells[i].innerText=board[i];let m=findMatches();if(m.length>=3){m.forEach(idx=>{board[idx]=CANDY;cells[idx].innerText=CANDY;cells[idx].classList.add('candy')});score+=m.length;document.getElementById('score').innerText=score;playSound(800);speak('Shabash!')}else{let tmp2=board[sel];board[sel]=board[i];board[i]=tmp2;cells[sel].innerText=board[sel];cells[i].innerText=board[i];playSound(200)}if(board.every(v=>v===CANDY)){document.getElementById('adBox').style.display='block';playSound(1200);speak('Level complete');try{(adsbygoogle=window.adsbygoogle||[]).push({})}catch(e){}}}cells[sel].style.borderColor='#ffe0b2';sel=null}}function findMatches(){let s=new Set();for(let r=0;r<6;r++)for(let c=0;c<4;c++){let idx=r*6+c;let v=board[idx];if(v===CANDY)continue;if(board[idx+1]===v&&board[idx+2]===v){s.add(idx);s.add(idx+1);s.add(idx+2)}}for(let c=0;c<6;c++)for(let r=0;r<4;r++){let idx=r*6+c;let v=board[idx];if(v===CANDY)continue;if(board[idx+6]===v&&board[idx+12]===v){s.add(idx);s.add(idx+6);s.add(idx+12)}}return Array.from(s)}let score2=0;function initFall(lv){score2=0;document.getElementById('grid').style.display='none';document.getElementById('fallArea').style.display='block';document.getElementById('fallArea').innerHTML='';document.getElementById('score').innerText='0/10';speak(lv.target.toLowerCase());startFall()}function startFall(){stopFall();spawnInt=setInterval(spawnFall,800);fallInt=setInterval(moveFall,40)}function stopFall(){clearInterval(spawnInt);clearInterval(fallInt)}function spawnFall(){let lv=LEVELS[cur];let area=document.getElementById('fallArea');let div=document.createElement('div');let w=Math.random()<0.6?lv.target:lv.words[Math.floor(Math.random()*lv.words.length)];div.className='falling';div.innerHTML='🍬 '+w;div.dataset.word=w;div.style.left=Math.random()*(area.clientWidth-90)+'px';div.style.top='-30px';div.onclick=()=>hitFall(div);area.appendChild(div)}function moveFall(){let a=document.getElementById('fallArea');document.querySelectorAll('.falling').forEach(el=>{let t=parseFloat(el.style.top)||0;t+=3;el.style.top=t+'px';if(t>a.clientHeight)el.remove()})}function hitFall(el){let lv=LEVELS[cur];if(el.dataset.word===lv.target){score2++;document.getElementById('score').innerText=score2+'/10';playSound(900);speak('Shabash '+el.dataset.word);el.remove();if(score2>=10){document.getElementById('adBox').style.display='block';stopFall();playSound(1200);try{(adsbygoogle=window.adsbygoogle||[]).push({})}catch(e){}}}else{playSound(200);speak('Galat');el.remove()}}</script></body></html>
