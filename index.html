<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#c8e6c9;display:flex;justify-content:center;padding:10px;padding-bottom:100px}.main{width:100%;max-width:420px}.ad{width:100%;background:#fff;border-radius:12px;margin:8px 0;min-height:90px;display:flex;align-items:center;justify-content:center;border:2px dashed #ffcc02}.card{background:white;border-radius:20px;padding:14px;box-shadow:0 8px 25px rgba(0,0,0,.2);text-align:center}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.lvl{border:2px solid #ffcc02;background:#fff8e1;border-radius:12px;padding:10px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;background:#fff3e0;padding:8px;border-radius:12px;margin:10px 0}.cell{aspect-ratio:1;background:white;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;border:2px solid #ffe0b2}.cell.candy{background:#e8f5e9;border-color:#4caf50}.btn{width:100%;background:#ff4081;color:white;border:none;padding:12px;border-radius:50px;font-weight:bold;cursor:pointer;margin-top:8px}#fallArea{position:relative;width:100%;height:360px;background:#e1f5fe;border-radius:12px;overflow:hidden;margin:10px 0;border:2px solid #ffcc02;display:none}.bubble{position:absolute;cursor:pointer;background:white;border-radius:50px;padding:5px 10px;border:2px solid #ff4081;font-weight:bold}.adBox{background:#e3f2fd;border:2px solid #2196f3;border-radius:12px;padding:12px;margin:10px 0;display:none}.footer{position:fixed;bottom:0;left:0;right:0;background:white;border-top:3px solid #4caf50;height:85px;display:flex;align-items:center;justify-content:center;z-index:99}</style></head><body>

<div class="ad"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="123" data-ad-format="auto" data-full-width-responsive="true"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script></div>
<div class="card" id="menu"><h2>🌾 ਪੰਜਾਬੀ ਟਾਫੀ ਕ੍ਰਸ਼</h2><p style="font-size:11px">Har Level + Side + Neeche Ad</p><div class="levels" id="levelMenu"></div></div>
<div class="card" id="game" style="display:none"><div style="display:flex;justify-content:space-between;font-weight:bold"><button onclick="goMenu()">⬅️</button><span id="levelTitle"></span><span id="score">0</span></div><div class="ad" style="min-height:60px"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="123" data-ad-format="auto"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script></div><div class="grid" id="grid"></div><div id="fallArea"></div><div class="adBox" id="adBox"><b>🎉 Level Complete - Ad Dekho</b><br><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="123" data-ad-format="auto"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script><button class="btn" style="background:#4caf50" onclick="nextLevel()">Next Level ➡️</button></div><button class="btn" style="background:#aaa" onclick="restart()">Restart</button></div>
</div><div class="footer"><ins class="adsbygoogle" style="display:inline-block;width:320px;height:50px" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="123"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script></div>
<script>
const LEVELS=[{id:1,name:"Level 1",type:"match",items:['🍪','🧁','🍭','🍫']},{id:2,name:"Level 2",type:"fall",target:"UDA",words:['UDA','KHED']},{id:3,name:"Level 3",type:"match",items:['🍎','🍓','🍇','🍊']},{id:4,name:"Level 4",type:"click",items:['🍪','🍦']},{id:5,name:"Level 5",type:"match",items:['⭐','🌙','☀️','🌈']},{id:6,name:"Level 6",type:"fall",target:"MITTI",words:['MITTI','PANI']}];
let cur=0,board=[],score=0,sel=null,sInt=null,fInt=null;const CANDY='🍬';
function buildMenu(){let m=document.getElementById('levelMenu');m.innerHTML='';LEVELS.forEach((lv,i)=>{let d=document.createElement('div');d.className='lvl';d.innerHTML='<b>'+lv.name+'</b><br>'+lv.type;d.onclick=()=>startLevel(i);m.appendChild(d)})}buildMenu();
function goMenu(){document.getElementById('game').style.display='none';document.getElementById('menu').style.display='block';clearInterval(sInt);clearInterval(fInt)}
function startLevel(i){cur=i;document.getElementById('menu').style.display='none';document.getElementById('game').style.display='block';restart()}
function nextLevel(){if(cur<5)startLevel(cur+1);else{alert('All Done!');goMenu()}}
function restart(){let lv=LEVELS[cur];document.getElementById('levelTitle').innerText=lv.name;document.getElementById('adBox').style.display='none';score=0;document.getElementById('score').innerText=0;document.getElementById('grid').style.display='grid';document.getElementById('fallArea').style.display='none';if(lv.type==='click')initClick(lv);else if(lv.type==='match')initMatch(lv);else initFall(lv)}
function initClick(lv){board=[];let g=document.getElementById('grid');g.innerHTML='';for(let i=0;i<36;i++){let it=lv.items[Math.floor(Math.random()*lv.items.length)];board.push(it);let d=document.createElement('div');d.className='cell';d.innerText=it;d.onclick=()=>{if(board[i]!==CANDY){board[i]=CANDY;d.innerText=CANDY;d.classList.add('candy');score++;document.getElementById('score').innerText=score;if(score>=36){document.getElementById('adBox').style.display='block';document.getElementById('grid').style.display='none';}}};g.appendChild(d)}}
function initMatch(lv){board=[];let g=document.getElementById('grid');g.innerHTML='';sel=null;for(let i=0;i<36;i++){let it=lv.items[Math.floor(Math.random()*lv.items.length)];board.push(it);let d=document.createElement('div');d.className='cell';d.innerText=it;d.onclick=()=>clickMatch(i);g.appendChild(d)}}
function clickMatch(i){let cells=document.querySelectorAll('.cell');if(sel===null){sel=i;cells[i].style.borderColor='#ff4081'}else{if(sel===i){cells[sel].style.borderColor='#ffe0b2';sel=null;return}let ok=Math.abs(sel-i)===1||Math.abs(sel-i)===6;if(ok){let tmp=board[sel];board[sel]=board[i];board[i]=tmp;cells[sel].innerText=board[sel];cells[i].innerText=board[i];let m=[];for(let r=0;r<6;r++)for(let c=0;c<4;c++){let id=r*6+c;let v=board[id];if(v!==CANDY&&board[id+1]===v&&board[id+2]===v)m.push(id,id+1,id+2)}if(m.length>=3){m.forEach(idx=>{board[idx]=CANDY;cells[idx].innerText=CANDY;cells[idx].classList.add('candy')});score+=m.length;document.getElementById('score').innerText=score;if(board.every(v=>v===CANDY)){document.getElementById('adBox').style.display='block';document.getElementById('grid').style.display='none';}} }cells[sel].style.borderColor='#ffe0b2';sel=null}}
let s2=0;
function initFall(lv){s2=0;document.getElementById('grid').style.display='none';document.getElementById('fallArea').style.display='block';document.getElementById('fallArea').innerHTML='';sInt=setInterval(()=>{let area=document.getElementById('fallArea');let div=document.createElement('div');let w=Math.random()<0.6?lv.target:lv.words[Math.floor(Math.random()*lv.words.length)];div.className='bubble';div.innerHTML='🍬 '+w;div.dataset.w=w;div.style.left=Math.random()*200+'px';div.style.top='0px';div.onclick=()=>{if(div.dataset.w===lv.target){s2++;document.getElementById('score').innerText=s2;div.remove();if(s2>=10){document.getElementById('adBox').style.display='block';document.getElementById('fallArea').style.display='none';clearInterval(sInt);clearInterval(fInt)}}else div.remove()};area.appendChild(div)},800);fInt=setInterval(()=>{document.querySelectorAll('.bubble').forEach(el=>{el.style.top=(parseInt(el.style.top||0)+3)+'px';if(parseInt(el.style.top)>360)el.remove()})},40)}
</script></body></html>
