<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>punjabi toffee crush game</title><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1905215538239803" crossorigin="anonymous"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#87CEEB;padding-bottom:100px}.box{max-width:400px;margin:20px auto;background:#fff;border-radius:20px;padding:20px;border:4px solid orange;text-align:center}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;background:#FFF3E0;padding:8px;border-radius:12px;margin-top:10px}.c{background:#fff;border-radius:10px;height:55px;display:flex;align-items:center;justify-content:center;font-size:28px;border:2px solid #FFCC02}.c.sel{border-color:#FF4081;background:#FCE4EC}.c.ok{background:#4CAF50!important;color:#fff!important;font-size:20px!important}.bar{width:100%;height:14px;background:#eee;border-radius:10px;margin:10px 0;overflow:hidden}.f{height:100%;background:#4CAF50;width:0%}#ad{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:4px solid orange;height:90px;display:flex;align-items:center;justify-content:center}</style></head><body><div class="box"><h1 style="color:#FF6F00">ਪੰਜਾਬੀ ਟਾਫੀ</h1><p style="color:#E91E63;font-weight:900;margin:5px 0">punjabi toffee crush game - V32 FINAL</p><div style="display:flex;justify-content:space-between;font-weight:900"><span id="lvl">ਲੈਵਲ 1</span><span id="sc" style="color:#E91E63">0/8</span></div><div class="bar"><div id="pf" class="f"></div></div><p style="color:#E91E63;font-weight:900">3 ਕੂਕੀ ਚੁਣੋ ਜੀ! 🍪🍪🍪</p><div class="grid" id="g"></div><button onclick="make()" style="margin-top:10px;background:orange;color:#fff;border:0;padding:10px 20px;border-radius:20px;font-weight:900">▶️ ਗੇਮ ਸ਼ੁਰੂ ਕਰੋ ਜੀ</button></div><div id="ad"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1905215538239803" data-ad-slot="1234567890" data-ad-format="auto" data-full-width-responsive="true"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script></div><script>let sc=0,sel=[],bd=[];function make(){let G=document.getElementById('g');G.innerHTML='';sel=[];sc=0;document.getElementById('sc').innerText='0/8';document.getElementById('pf').style.width='0%';let p=[];for(let i=0;i<8;i++)p.push("🍪");for(let i=0;i<8;i++)p.push("🍩");for(let i=0;i<8;i++)p.push("🧁");p.sort(()=>Math.random()-0.5);bd=p.slice();for(let i=0;i<p.length;i++){let d=document.createElement('div');d.className='c';d.innerText=p[i];d.onclick=function(){if(this.classList.contains('ok')||this.classList.contains('sel'))return;this.classList.add('sel');sel.push(i);if(sel.length==3){let a=bd[sel[0]],b=bd[sel[1]],c2=bd[sel[2]];let all=document.querySelectorAll('.c');if(a==b&&b==c2){sel.forEach(s=>{all[s].innerText='✅';all[s].className='c ok';});sc++;document.getElementById('sc').innerText=sc+'/8';document.getElementById('pf').style.width=(sc/8*100)+'%';sel=[];if(sc>=8)setTimeout(()=>{alert('Level Complete! 🏆');make();},300);}else{let t=[...sel];setTimeout(()=>{t.forEach(s=>all[s].classList.remove('sel'));},300);sel=[];}}};G.appendChild(d);}}make();</script></body></html>
