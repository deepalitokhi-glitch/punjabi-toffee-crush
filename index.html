<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Punjabi Toffee - FINAL All Features</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{min-height:100vh;background:#c8e6c9;display:flex;justify-content:center;align-items:center;padding:12px}
.card{background:white;border-radius:20px;padding:16px;width:100%;max-width:420px;box-shadow:0 8px 25px rgba(0,0,0,.2);text-align:center}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.lvl{border:2px solid #ffcc02;background:#fff8e1;border-radius:12px;padding:10px;cursor:pointer;font-size:11px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;background:#fff3e0;padding:8px;border-radius:12px;margin:10px 0}
.cell{aspect-ratio:1;background:white;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;border:2px solid #ffe0b2}
.cell.done{background:#e8f5e9;border-color:#4caf50}
#fall{position:relative;width:100%;height:380px;background:linear-gradient(#e1f5fe,#fff9c4);border-radius:12px;overflow:hidden;margin:10px 0;display:none;border:2px solid #ffcc02}
.bubble{position:absolute;background:white;border-radius:50px;padding:6px 12px;border:2px solid #ff4081;font-weight:bold;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2);font-size:13px}
.btn{width:100%;background:#ff4081;color:white;border:none;padding:12px;border-radius:50px;font-weight:bold;cursor:pointer;margin-top:8px}
.ad{background:#e3f2fd;border:2px dashed #2196f3;border-radius:12px;padding:10px;margin:10px 0;font-size:12px}
.ad.hide{display:none}
.top{display:flex;justify-content:space-between;font-weight:bold;font-size:13px}
</style></head><body>

<div class="card" id="menu">
<h2>🌾 Punjabi Toffee - FINAL</h2>
<p style="font-size:11px;color:#666">Ad + Menu + Sound + Voice + All Levels</p>
<div class="levels" id="lvMenu"></div>
<div class="ad">📢 <b>Ad - Earning ON</b><br><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="1234567890" data-ad-format="auto"></ins><br><small>Real ID lagane pe earning start</small></div>
</div>

<div class="card" id="game" style="display:none">
<div class="top"><button onclick="showMenu()">⬅️ Menu</button><span id="lvName">Level 1</span><span id="sc">0/36</span></div>
<p id="hint" style="font-size:12px;margin:6px 0">Hint</p>
<div class="grid" id="grid"></div>
<div id="fall"></div>
<div class="ad hide" id="adBox"><div style="font-size:18px">🎉 Level Complete!</div>Sab Toffee! 📢 Ad Earning 💰<br><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="1234567890" data-ad-format="auto"></ins><br><button class="btn" onclick="nextLv()">➡️ Next Level</button></div>
<button class="btn" style="background:#4caf50" onclick="start()">🔄 Restart</button>
<div style="font-size:10px;margin-top:6px;color:#666">🔊 Sound ON | 🗣️ Voice ON | 📢 Ad ON | 👆 Click ON</div>
</div>

<script>
const LEVELS=[
{name:"Level 1", type:"click", items:["🍪","🧁","🍭","🍫"], hint:"Kahin bhi click karo - Cookie se Toffee banao! 👆"},
{name:"Level 2", type:"uda", target:"UDA", words:["UDA","KHED","PIND","GUDDI"], hint:"UDA bubble pakdo! Voice UDA bolega 🔊"},
{name:"Level 3", type:"click", items:["🍎","🍓","🍇","🍊"], hint:"Fruit pe click - Toffee banao!"},
{name:"Level 4", type:"click", items:["🍪","🍦"], hint:"Level 4 - ONLY Cookies 🍪 & Icecream 🍦 - Click se Toffee!"},
{name:"Level 5", type:"click", items:["⭐","🌙","☀️","🍪"], hint:"Click karo - Toffee banao!"},
{name:"Level 6", type:"uda", target:"MITTI", words:["MITTI","PANI","BOLI","PIND"], hint:"MITTI bubble pakdo! 🔊"},
];
let cur=0, board=[], score=0, actx=null, fallInt=null, spawnInt=null, score2=0;
const TOFFEE="🍬";
function sound(f){try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state=="suspended")actx.resume();let o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;g.gain.value=.3;o.connect(g);g.connect(actx.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+.3);setTimeout(()=>{try{o.stop()}catch(e){}},350)}catch(e){}}
function speak(t){try{let u=new SpeechSynthesisUtterance(t);u.lang="en-IN";u.rate=0.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
let m=document.getElementById("lvMenu");
LEVELS.forEach((lv,i)=>{let d=document.createElement("div");d.className="lvl";d.innerHTML=`<span style="font-size:20px">${lv.type=="click"?"👆":"🍬"}</span><br><b>${lv.name}</b><br><small>${lv.type=="click"?"Click Toffee":lv.target}</small>`;d.onclick=()=>{cur=i;showGame()};m.appendChild(d)});
function showMenu(){document.getElementById("menu").style.display="block";document.getElementById("game").style.display="none";clearInterval(fallInt);clearInterval(spawnInt)}
function showGame(){document.getElementById("menu").style.display="none";document.getElementById("game").style.display="block";start();try{(adsbygoogle=window.adsbygoogle||[]).push({})}catch(e){}}
function nextLv(){if(cur<LEVELS.length-1){cur++;start()}else{alert("All 6 Levels Complete! 🎉");showMenu()}}
function start(){
let lv=LEVELS[cur];document.getElementById("lvName").innerText=lv.name;document.getElementById("hint").innerText=lv.hint;document.getElementById("adBox").classList.add("hide");score=0;score2=0;
document.getElementById("grid").style.display=lv.type=="click"?"grid":"none";
document.getElementById("fall").style.display=lv.type=="uda"?"block":"none";
document.getElementById("sc").innerText=lv.type=="click"?"0/36":"0/10";
if(lv.type=="click"){initClick(lv)}else{initUda(lv)}
}
function initClick(lv){
board=[];let g=document.getElementById("grid");g.innerHTML="";
for(let i=0;i<36;i++){let it=lv.items[Math.floor(Math.random()*lv.items.length)];board.push(it);let c=document.createElement("div");c.className="cell";c.innerText=it;c.onclick=()=>clickCell(i);g.appendChild(c);}
speak(lv.name+" shuru");
}
function clickCell(i){
let cells=document.querySelectorAll(".cell");
if(board[i]==TOFFEE)return;
board[i]=TOFFEE;cells[i].innerText=TOFFEE;cells[i].classList.add("done");
score++;document.getElementById("sc").innerText=score+"/36";
sound(800);if(navigator.vibrate)navigator.vibrate(30);
if(score>=36){document.getElementById("adBox").classList.remove("hide");sound(1200);speak("Level complete! Sab toffee ban gaye!");try{(adsbygoogle=window.adsbygoogle||[]).push({})}catch(e){}}
}
function initUda(lv){let a=document.getElementById("fall");a.innerHTML="";speak(lv.target);spawnInt=setInterval(spawnBubble,900);fallInt=setInterval(moveBubble,40)}
function spawnBubble(){let lv=LEVELS[cur];let area=document.getElementById("fall");let div=document.createElement("div");div.className="bubble";let w=Math.random()<0.6?lv.target:lv.words[Math.floor(Math.random()*lv.words.length)];div.innerText="🍬 "+w;div.dataset.word=w;div.style.left=Math.random()*(area.clientWidth-90)+"px";div.style.top="-30px";div.onclick=()=>hitBubble(div);area.appendChild(div)}
function moveBubble(){let area=document.getElementById("fall");document.querySelectorAll(".bubble").forEach(el=>{let t=parseFloat(el.style.top)||0;t+=2.5;el.style.top=t+"px";if(t>area.clientHeight)el.remove()})}
function hitBubble(el){let lv=LEVELS[cur];if(el.dataset.word==lv.target){score2++;document.getElementById("sc").innerText=score2+"/10";sound(900);speak(el.dataset.word);el.remove();if(score2>=10){document.getElementById("adBox").classList.remove("hide");clearInterval(spawnInt);clearInterval(fallInt);sound(1200);speak("Level complete!");try{(adsbygoogle=window.adsbygoogle||[]).push({})}catch(e){}}}else{sound(200);speak("Galat");el.remove()}}
try{(adsbygoogle=window.adsbygoogle||[]).push({})}catch(e){}
</script></body></html>
