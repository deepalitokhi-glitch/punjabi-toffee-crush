<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Punjabi Toffee - Proof</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1905215538239803" crossorigin="anonymous"></script>
<style>
body{margin:0;background:#c8e6c9;font-family:Arial;display:flex;justify-content:center}
.main{width:100%;max-width:400px;padding:10px}
.card{background:#fff;border-radius:18px;padding:14px;margin-top:10px;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:12px}
.cell{aspect-ratio:1;background:#fff8e1;border:2px solid #ffcc02;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer}
.cell.done{background:#a5d6a7}
.lvl{border:2px solid orange;border-radius:12px;padding:12px;text-align:center;background:#fffde7;font-weight:bold;margin:6px 0;cursor:pointer}
#game{display:none}
.btn{width:100%;padding:12px;border:none;border-radius:25px;background:#4caf50;color:#fff;font-weight:bold;margin-top:10px}
</style>
</head>
<body>
<div class="main">
<div class="card" id="menu">
<h2 style="text-align:center">🌾 ਪੰਜਾਬੀ ਟਾਫੀ ਕ੍ਰਸ਼</h2>
<p style="text-align:center;font-size:12px;color:#666">Aap kar sakti ho!</p>
<div class="lvl" onclick="start(0)">Level 1 - ਮਿਠਾਈ ਮੈਚ</div>
<div class="lvl" onclick="start(1)">Level 2 - ਉਡਾਣ UDA</div>
<div class="lvl" onclick="start(2)">Level 3 - ਫਲਾਂ ਦੀ ਮਿਠਾਸ</div>
<div class="lvl" onclick="start(3)">Level 4 - ਟਾਫੀ ਬਣਾਓ</div>
<div class="lvl" onclick="start(4)">Level 5 - ਤਾਰਿਆਂ ਦੀ ਖੇਡ</div>
<div class="lvl" onclick="start(5)">Level 6 - ਮਿੱਟੀ ਦੀ ਖੁਸ਼ਬੂ</div>
</div>
<div class="card" id="game">
<div style="display:flex;justify-content:space-between"><button onclick="menu()">⬅️ Menu</button><b id="t"></b><b>⭐<span id="sc">0</span></b></div>
<div class="grid" id="g"></div>
<div id="win" style="display:none;text-align:center;margin-top:12px;background:#e8f5e9;padding:12px;border-radius:12px"><h3>🎉 ਸ਼ਾਬਾਸ਼! Level Complete</h3><button class="btn" onclick="nextL()">Next ➡️</button></div>
</div>
</div>
<script>
let cur=0,score=0;
let names=["ਮਿਠਾਈ ਮੈਚ","ਉਡਾਣ UDA","ਫਲਾਂ ਦੀ ਮਿਠਾਸ","ਟਾਫੀ ਬਣਾਓ","ਤਾਰਿਆਂ ਦੀ ਖੇਡ","ਮਿੱਟੀ ਦੀ ਖੁਸ਼ਬੂ"];
function menu(){document.getElementById('game').style.display='none';document.getElementById('menu').style.display='block';}
function start(n){cur=n;score=0;document.getElementById('sc').innerText=0;document.getElementById('menu').style.display='none';document.getElementById('game').style.display='block';document.getElementById('win').style.display='none';document.getElementById('t').innerText=names[n];let grid=document.getElementById('g');grid.innerHTML='';let e=['🍪','🍭','🍎','🍩','⭐','🌾'];for(let i=0;i<36;i++){let d=document.createElement('div');d.className='cell';d.innerText=e[Math.floor(Math.random()*e.length)];d.onclick=function(){if(d.innerText!='🍬'){d.innerText='🍬';d.classList.add('done');score++;document.getElementById('sc').innerText=score;if(score>=12)document.getElementById('win').style.display='block';}};grid.appendChild(d);}}
function nextL(){if(cur<5)start(cur+1);else{menu();alert('All 6 Levels Done! Aapne prove kar diya! 🎉');}}
</script>
</body>
</html>
