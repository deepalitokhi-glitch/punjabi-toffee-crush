<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Punjabi Toffee Crush</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui;background:linear-gradient(135deg,#ff9933,#fff,#138808);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px}h1{margin:10px;color:#b0005a}#stats{display:flex;gap:15px;margin:10px;font-weight:bold;background:#fff;padding:8px 15px;border-radius:20px}#board{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;background:#fff;padding:8px;border-radius:12px;width:95vw;max-width:360px;aspect-ratio:1}.cell{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:28px}.cell.selected{outline:3px solid #ff0080;transform:scale(1.1)}.btn{margin-top:12px;background:#ff0080;color:#fff;border:0;padding:10px 20px;border-radius:20px;font-weight:bold}</style></head><body><h1>🍬 Punjabi Toffee Crush 🍬</h1><div id="stats"><span>Score: <b id="score">0</b></span><span>Moves: <b id="moves">25</b></span></div><div id="board"></div><button class="btn" onclick="init()">New Game</button><script>const emojis=['🍬','🍭','🍫','🧁','🍩','🍪'];let board=[],sel=null,score=0,moves=25;const bEl=document.getElementById('board'),sEl=document.getElementById('score'),mEl=document.getElementById('moves');function init(){board=[];score=0;moves=25;sel=null;for(let r=0;r<8;r++){let row=[];for(let c=0;c<8;c++)row.push(emojis[Math.floor(Math.random()*6)]);board.push(row)}render();}function render(){bEl.innerHTML='';for(let r=0;r<8;r++)for(let c=0;c<8;c++){let d=document.createElement('div');d.className='cell';d.textContent=board[r][c];if(sel&&sel.r==r&&sel.c==c)d.classList.add('selected');d.onclick=()=>click(r,c);bEl.appendChild(d);}sEl.textContent=score;mEl.textContent=moves;}function click(r,c){if(!sel){sel={r,c};render();return;}let dr=Math.abs(sel.r-r),dc=Math.abs(sel.c-c);if((dr==1&&dc==0)||(dc==1&&dr==0)){swap(sel.r,sel.c,r,c);if(checkMatch()){moves--;score+=10;setTimeout(()=>removeMatches(),200);}else swap(sel.r,sel.c,r,c);}sel=null;render();}function swap(r1,c1,r2,c2){let t=board[r1][c1];board[r1][c1]=board[r2][c2];board[r2][c2]=t;}function checkMatch(){for(let r=0;r<8;r++)for(let c=0;c<6;c++)if(board[r][c]==board[r][c+1]&&board[r][c]==board[r][c+2])return true;for(let c=0;c<8;c++)for(let r=0;r<6;r++)if(board[r][c]==board[r+1][c]&&board[r][c]==board[r+2][c])return true;return false;}function removeMatches(){let toRemove=new Set();for(let r=0;r<8;r++)for(let c=0;c<6;c++)if(board[r][c]&&board[r][c]==board[r][c+1]&&board[r][c]==board[r][c+2]){toRemove.add(r+','+c);toRemove.add(r+','+(c+1));toRemove.add(r+','+(c+2));}for(let c=0;c<8;c++)for(let r=0;r<6;r++)if(board[r][c]&&board[r][c]==board[r+1][c]&&board[r][c]==board[r+2][c]){toRemove.add(r+','+c);toRemove.add((r+1)+','+c);toRemove.add((r+2)+','+c);}if(toRemove.size==0)return;toRemove.forEach(k=>{let[r,c]=k.split(',').map(Number);board[r][c]=null;score+=5;});for(let c=0;c<8;c++){let col=[];for(let r=7;r>=0;r--)if(board[r][c])col.push(board[r][c]);for(let r=7;r>=0;r--)board[r][c]=col[7-r]?col[7-r]:emojis[Math.floor(Math.random()*6)];}render();if(checkMatch())setTimeout(removeMatches,200);if(moves<=0)setTimeout(()=>alert('Score: '+score),300);}init();</script></body></html>
